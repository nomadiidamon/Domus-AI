[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domus-ai"
version = "0.1.0"
description = "Domus-AI: local AI runtime with hardware detection, model management, and agent subsystems."
authors = [
    { name = "nomad_ii_damon" }
]

requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "packaging>=23.0",
    "nvidia-ml-py>=12.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
homepage = "https://github.com/nomadiidamon/Domus-AI"

# Explicit package list rather than find_packages(), since the subsystem
# packages (Hestia, Janus, Mentis, Faber, Custos, Mercurius, Lares,
# DomusAPI) don't share a common namespace prefix — each is independently
# top-level under src/.

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["utils"]

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.pytest.ini_options]

# Where pytest looks for tests.
testpaths = ["tests"]

# Standard test discovery patterns.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Registered markers.
markers = [
    "hestia: tests for the Hestia subsystem (hardware detection, model catalog)",
    "janus: tests for the Janus subsystem (CLI, config, paths, dependencies, doctor, installer)",
    "faber: tests for the Faber subsystem (sessions, model/ollama/claude process management)",
    "mentis: tests for the Mentis subsystem (runtime context and state)",
    "custos: tests for the Custos subsystem (security, permissions, MCP)",
    "lares: tests for the Lares subsystem (agents) — currently a stub package",
    "mercurius: tests for the Mercurius subsystem (event bus) — currently a stub package",
    "domusapi: tests for the DomusAPI subsystem (top-level wrapper) — currently a stub package",
    "utils: tests for the shared utils module",
]

# Fail loudly on unknown markers.
addopts = "--strict-markers -ra"